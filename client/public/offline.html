<!doctype html>
<html lang="ta">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>இணையம் இல்லை — குறளகம்</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #2f2518;
        color: #dfd2b2;
        font-family: 'Noto Sans Tamil', 'Segoe UI', sans-serif;
      }
      .box {
        text-align: center;
        padding: 40px 24px;
        max-width: 420px;
      }
      .mark {
        font-family: 'Noto Serif Tamil', serif;
        font-size: 40px;
        font-weight: 800;
        color: #ddba62;
        letter-spacing: 1px;
        margin: 0 0 12px;
      }
      .leaf {
        font-size: 15px;
        color: #e9a13b;
        margin-bottom: 18px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 10px;
        color: #f2e7cb;
      }
      p {
        font-size: 14.5px;
        line-height: 1.8;
        margin: 0 0 22px;
        color: #ab9a78;
      }
      a {
        display: inline-block;
        padding: 11px 22px;
        border-radius: 12px;
        background: #ddba62;
        color: #211a0f;
        font-weight: 700;
        font-size: 14px;
        text-decoration: none;
      }
      a:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <p class="mark">குறளகம்</p>
      <div class="leaf">🍃 நீங்கள் இணையத்தில் இல்லை</div>
      <h1>இணைப்பு துண்டிக்கப்பட்டது</h1>
      <p>
        கொஞ்சம் பொறுங்கள் — இணைப்பு துண்டிக்கப்பட்டுள்ளது. இணைப்பு வந்தவுடன் மீண்டும்
        முயற்சிக்கவும். இணையத்திற்கு சென்ற பக்கங்களை ஆஃப்லைனிலும் படிக்கலாம்.
      </p>
      <a href="/">மீண்டும் முயற்சி</a>
    </div>
  </body>
</html>
